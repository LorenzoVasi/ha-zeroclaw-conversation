[pytest]
asyncio_mode = auto
testpaths = tests
# The e2e suite needs a real ZeroClaw gateway (see tests/e2e/README.md);
# excluded by default so `pytest` stays hermetic and fast. Run it with
# `pytest -m e2e`.
addopts = -m "not e2e"
markers =
    e2e: requires a running ZeroClaw gateway wired to the fake model.
